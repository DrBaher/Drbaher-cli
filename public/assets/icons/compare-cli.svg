        fill="#fdfcf9" stroke="#1f7d5d" stroke-width="15"/>
  <line x1="92" y1="176" x2="178" y2="176" stroke="#1f7d5d" stroke-width="13" stroke-linecap="round"/>
  <line x1="92" y1="224" x2="178" y2="224" stroke="#1f7d5d" stroke-width="13" stroke-linecap="round"/>
  <line x1="92" y1="272" x2="178" y2="272" stroke="#1f7d5d" stroke-width="13" stroke-linecap="round"/>
