<svg xmlns="http://www.w3.org/2000/svg" viewBox="54 53 406 406">
  <!-- Transparent background: blends with the (light or dark) sidebar.
       Single medium-green (#1f7d5d) reads on both cream and near-black. -->
  <!-- contract page, open outline -->
  <path d="M 74 108 L 244 108 L 296 160 L 296 404 L 74 404 Z"
        fill="none" stroke="#1f7d5d" stroke-width="22" stroke-linejoin="round"/>
  <path d="M 244 108 L 296 160 L 244 160 Z" fill="#1f7d5d"/>
  <!-- clause lines + a filled key-clause bar -->
  <line x1="108" y1="200" x2="262" y2="200" stroke="#1f7d5d" stroke-width="18" stroke-linecap="round"/>
  <rect x="100" y="232" width="126" height="28" rx="14" fill="#1f7d5d"/>
  <line x1="108" y1="296" x2="262" y2="296" stroke="#1f7d5d" stroke-width="18" stroke-linecap="round"/>
  <line x1="108" y1="340" x2="214" y2="340" stroke="#1f7d5d" stroke-width="18" stroke-linecap="round"/>
  <!-- pipeline relay: dots flow forward into a chevron -->
  <circle cx="330" cy="256" r="16" fill="#1f7d5d"/>
  <circle cx="378" cy="256" r="16" fill="#1f7d5d"/>
  <path d="M 410 230 L 442 256 L 410 282" fill="none" stroke="#1f7d5d" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
