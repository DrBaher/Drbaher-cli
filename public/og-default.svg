<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfcf9"/>
      <stop offset="60%" stop-color="#f0f9f5"/>
      <stop offset="100%" stop-color="#dff2e8"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f7d5d"/>
      <stop offset="100%" stop-color="#0c5642"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M0 0H60M0 0V60" stroke="#1f7d5d" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0" y="0" width="14" height="630" fill="url(#ink)"/>

  <g transform="translate(80,90)">
    <circle cx="14" cy="14" r="12" fill="#1f7d5d"/>
    <text x="40" y="22" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" font-weight="500" letter-spacing="0.06em" fill="#0c5642">contract-ops CLI suite</text>
  </g>

  <g transform="translate(80,200)">
    <text font-family="Georgia, 'Source Serif 4', serif" font-size="78" font-weight="600" letter-spacing="-0.02em" fill="#1a1612">
      <tspan x="0" dy="0">Six CLIs for the</tspan>
      <tspan x="0" dy="92">contract workflow.</tspan>
    </text>
    <text font-family="-apple-system, 'Inter', 'Helvetica Neue', sans-serif" font-size="28" fill="#3d362f">
      <tspan x="0" dy="170">Fill templates · review against your policy · convert</tspan>
      <tspan x="0" dy="40">to PDF · sign with audit trails. Local-first, MIT.</tspan>
    </text>
  </g>

  <g transform="translate(80,528)" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="17" fill="#1f7d5d" font-weight="500">
    <text y="0">template-vault-cli · draft-cli · nda-review-cli</text>
    <text y="30">compare-cli · docx2pdf-cli · sign-cli</text>
  </g>

  <g transform="translate(960,80)">
    <rect x="0" y="0" width="160" height="120" rx="8" fill="white" stroke="#a3d3c0" stroke-width="1.5"/>
    <text x="14" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#0c5642" letter-spacing="0.1em">YOUR MACHINE</text>
    <g font-family="ui-monospace, monospace" font-size="11" fill="#1a1612">
      <text x="14" y="50">$ draft fill nda.docx</text>
      <text x="14" y="70" fill="#0c5642">→ ✓ 7 placeholders</text>
      <text x="14" y="90">$ sign-cli verify</text>
      <text x="14" y="110" fill="#0c5642">→ ✓ chain intact</text>
    </g>
  </g>
</svg>
