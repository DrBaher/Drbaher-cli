<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#fdfcf9"/>
  <!-- contract page (folded corner) -->
  <path d="M 5 6.5 L 14.5 6.5 L 18.5 10.5 L 18.5 25.5 L 5 25.5 Z"
        fill="#fdfcf9" stroke="#1f7d5d" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- clause lines; second is the accent -->
  <line x1="8" y1="13" x2="15.5" y2="13" stroke="#1f7d5d" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="8" y1="16.5" x2="15.5" y2="16.5" stroke="#0e4a37" stroke-width="1.8" stroke-linecap="round"/>
  <!-- forward chevron: the pipeline 'flow' -->
  <path d="M 22 11.5 L 26.5 16 L 22 20.5" fill="none" stroke="#1f7d5d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
